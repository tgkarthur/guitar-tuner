<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tuner">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>Guitar Tuner</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --text:#f2f4f8; --muted:#8b93a3;
    --ok:#3ddc84; --warn:#ffb020; --bad:#ff5c5c; --accent:#6ea8ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  body{display:flex;flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  header{display:flex;gap:8px;align-items:center;justify-content:space-between}
  select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid #2a2f3a;
    border-radius:12px;padding:10px 12px}
  select{flex:1;min-width:0}
  .ref{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
  .ref button{width:36px;height:40px;padding:0;font-size:20px}
  .ref b{color:var(--text);min-width:60px;text-align:center;font-weight:600}

  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
  body.stale main{opacity:.45}
  main{transition:opacity .3s}
  #note{font-size:min(34vw,200px);font-weight:700;line-height:1;transition:color .15s}
  #note small{font-size:.3em;vertical-align:super;margin-left:2px}
  #freq{color:var(--muted);font-size:18px;height:24px;font-variant-numeric:tabular-nums}
  #hint{font-size:22px;font-weight:600;height:30px}

  .meter{position:relative;width:100%;max-width:420px;height:90px;margin-top:10px}
  .meter svg{width:100%;height:100%;overflow:visible}
  #needle{transition:transform .08s linear;transform-origin:210px 80px}
  #lvlbox{width:60%;max-width:240px;height:6px;background:#1f232c;border-radius:3px;overflow:hidden}
  #lvl{height:100%;width:0;background:var(--accent);transition:width .05s}
  #dbg{color:#7d8597;font-size:12px;min-height:16px;font-variant-numeric:tabular-nums}
  #cents{color:var(--muted);font-variant-numeric:tabular-nums;height:22px;font-size:16px}

  .strings{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
  .strings.twelve{gap:6px}
  .strings.twelve button{padding:9px 0;font-size:18px}
  #tip{color:var(--muted);font-size:12px;text-align:center;margin:-6px 0 10px;min-height:0}
  .strings button{padding:14px 0;font-size:20px;font-weight:600;border-radius:14px;position:relative}
  .strings button small{display:block;font-size:11px;font-weight:400;color:var(--muted)}
  .strings button.near{border-color:var(--accent);color:var(--accent)}
  .strings button.sel{background:var(--accent);color:#0b1020;border-color:var(--accent)}
  .strings button.sel small{color:#0b1020}
  .strings button.done::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}

  #start{width:100%;padding:18px;font-size:20px;font-weight:700;background:var(--accent);color:#0b1020;border:0;border-radius:16px}
  #start.on{background:var(--panel);color:var(--muted);border:1px solid #2a2f3a;font-size:16px;padding:12px}
  #msg{color:var(--muted);font-size:13px;text-align:center;margin:8px 0 0;min-height:18px}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
</style>
</head>
<body>
<header>
  <select id="tuning" aria-label="Tuning"></select>
  <div class="ref"><button id="refDn" aria-label="Lower reference">−</button><b id="refTxt">A=440</b><button id="refUp" aria-label="Raise reference">+</button></div>
</header>

<main>
  <div id="note">–</div>
  <div id="freq">&nbsp;</div>
  <div class="meter">
    <svg viewBox="0 0 420 90">
      <path d="M20 80 A190 190 0 0 1 400 80" fill="none" stroke="#2a2f3a" stroke-width="2"/>
      <g stroke="#3a4150" stroke-width="2">
        <line x1="210" y1="0" x2="210" y2="18" stroke="#6b7385" stroke-width="3"/>
      </g>
      <g id="ticks" stroke="#3a4150" stroke-width="2"></g>
      <g id="needle"><line x1="210" y1="80" x2="210" y2="8" stroke="#fff" stroke-width="4" stroke-linecap="round" id="needleLine"/></g>
      <circle cx="210" cy="80" r="6" fill="#fff"/>
    </svg>
  </div>
  <div id="cents">&nbsp;</div>
  <div id="lvlbox"><div id="lvl"></div></div>
  <div id="dbg"></div>
  <div id="hint">Tap Start, then pluck a string</div>
</main>

<div class="strings" id="strings"></div>
<p id="tip"></p>
<button id="start">Start tuning</button>
<p id="msg"></p>

<script>
"use strict";
const NOTES=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
// strings listed low → high, as MIDI note numbers
const TUNINGS={
  "Standard (EADGBE)":[40,45,50,55,59,64],
  "Drop D":[38,45,50,55,59,64],
  "Half step down":[39,44,49,54,58,63],
  "Full step down (DGCFAD)":[38,43,48,53,57,62],
  "DADGAD":[38,45,50,55,57,62],
  "Open G":[38,43,50,55,59,62],
  "Open D":[38,45,50,54,57,62],
  "Open E":[40,47,52,56,59,64],
  // 12-string: listed as pairs per course (thick string, then its octave / unison partner)
  "12-string Standard":[40,52,45,57,50,62,55,67,59,59,64,64],
  "12-string Half step down":[39,51,44,56,49,61,54,66,58,58,63,63],
  "12-string Full step down":[38,50,43,55,48,60,53,65,57,57,62,62],
  "Bass-less / Chromatic (any note)":null
};
let A4=+localStorage.getItem("a4")||440;
let tuningName=localStorage.getItem("tuning")||"Standard (EADGBE)";
if(!(tuningName in TUNINGS)) tuningName="Standard (EADGBE)";
let selected=null;           // manually chosen string index, or null for auto
let done=new Set();

const $=id=>document.getElementById(id);
const midiToFreq=m=>A4*Math.pow(2,(m-69)/12);
const freqToMidiF=f=>69+12*Math.log2(f/A4);
const noteName=m=>NOTES[((m%12)+12)%12];
const oct=m=>Math.floor(m/12)-1;

// ---------- UI setup ----------
const sel=$("tuning");
Object.keys(TUNINGS).forEach(k=>{const o=document.createElement("option");o.textContent=k;o.value=k;sel.appendChild(o)});
sel.value=tuningName;
sel.onchange=()=>{tuningName=sel.value;localStorage.setItem("tuning",tuningName);selected=null;done.clear();buildStrings()};
function setRef(v){A4=Math.min(460,Math.max(420,v));localStorage.setItem("a4",A4);$("refTxt").textContent="A="+A4;buildStrings()}
$("refDn").onclick=()=>setRef(A4-1);$("refUp").onclick=()=>setRef(A4+1);setRef(A4);

(function ticks(){ // meter ticks at -50..+50 cents
  const g=$("ticks");
  for(let c=-50;c<=50;c+=10){
    const a=(c/50)*Math.PI/3;           // ±60°
    const r1=c%50===0?170:178, r2=190;
    const x=210+Math.sin(a), y=80;
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    const cx=210,cy=80;
    l.setAttribute("x1",cx+r1*Math.sin(a));l.setAttribute("y1",cy-r1*Math.cos(a));
    l.setAttribute("x2",cx+r2*Math.sin(a));l.setAttribute("y2",cy-r2*Math.cos(a));
    g.appendChild(l);
  }
})();

function buildStrings(){
  const box=$("strings");box.innerHTML="";
  const t=TUNINGS[tuningName];
  if(!t){box.style.display="none";$("tip").textContent="";return}
  box.style.display="grid";
  const twelve=t.length===12;
  box.classList.toggle("twelve",twelve);
  $("tip").textContent=twelve?"12-string: pluck one string at a time (mute its pair), or tap a string to lock onto it. The two top pairs are unisons.":"";
  const order=twelve?[0,2,4,6,8,10,1,3,5,7,9,11]:t.map((_,i)=>i);   // row 1 = thick strings, row 2 = octave strings
  order.forEach(i=>{
    const m=t[i];
    const b=document.createElement("button");
    b.dataset.i=i;
    b.innerHTML=noteName(m)+"<small>"+(twelve?oct(m):(6-i))+"</small>";
    if(selected===i)b.classList.add("sel");
    if([...done].some(j=>t[j]===m))b.classList.add("done");     // unison pairs share a tick
    b.onclick=()=>{selected=(selected===i)?null:i;buildStrings();playRef(m)};
    box.appendChild(b);
  });
}
buildStrings();

// optional: tap a string to hear its reference tone
let outCtx=null;
function playRef(m){
  try{
    outCtx=outCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=outCtx.createOscillator(),g=outCtx.createGain();
    o.type="triangle";o.frequency.value=midiToFreq(m);
    g.gain.setValueAtTime(0,outCtx.currentTime);
    g.gain.linearRampToValueAtTime(.25,outCtx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,outCtx.currentTime+1.2);
    o.connect(g).connect(outCtx.destination);o.start();o.stop(outCtx.currentTime+1.3);
  }catch(e){}
}

// ---------- pitch detection (YIN) ----------
function yin(buf,sr){
  const N=buf.length, W=N>>1;
  let pk=0;for(let i=0;i<N;i++){const a=Math.abs(buf[i]);if(a>pk)pk=a}
  if(pk<1e-5)return null;
  const g=0.5/pk;                       // software gain so quiet notes still register
  const x0=new Float32Array(N);for(let i=0;i<N;i++)x0[i]=buf[i]*g;
  buf=x0;
  const tauMin=Math.floor(sr/700), tauMax=Math.min(W-1,Math.floor(sr/50));
  const d=new Float32Array(tauMax+1);
  for(let tau=1;tau<=tauMax;tau++){
    let s=0;
    for(let i=0;i<W;i++){const x=buf[i]-buf[i+tau];s+=x*x}
    d[tau]=s;
  }
  // cumulative mean normalised difference
  let run=0;d[0]=1;
  for(let tau=1;tau<=tauMax;tau++){run+=d[tau];d[tau]=d[tau]*tau/run}
  const TH=0.2;
  let tau=-1;
  for(let t=tauMin;t<=tauMax;t++){
    if(d[t]<TH){while(t+1<=tauMax&&d[t+1]<d[t])t++;tau=t;break}
  }
  if(tau<0){ // fall back to global min if reasonably clear
    let m=tauMin;for(let t=tauMin;t<=tauMax;t++)if(d[t]<d[m])m=t;
    if(d[m]<0.4)tau=m;else return null;
  }
  // parabolic interpolation
  const a=d[tau-1],b=d[tau],c=d[tau+1]||b;
  const den=(a+c-2*b);
  const shift=den?0.5*(a-c)/den:0;
  return sr/(tau+shift);
}
window.__yin=yin; // exposed for testing

// ---------- guided detection: only look near each string's expected pitch ----------
// Normalised difference function (with software gain). Returns null if silent.
function ndf(buf,sr,tauMax){
  const N=buf.length, W=Math.min(3072,N>>1), base=N-W;   // window = newest W samples; lags look back
  tauMax=Math.min(tauMax,base-1);
  let pk=0;for(let i=base;i<N;i++){const a=Math.abs(buf[i]);if(a>pk)pk=a}
  if(pk<1e-5)return null;
  const g=0.5/pk, x=new Float32Array(N);
  for(let i=0;i<N;i++)x[i]=buf[i]*g;
  const d=new Float32Array(tauMax+2);
  for(let tau=1;tau<=tauMax;tau++){
    let s=0;for(let i=base;i<N;i++){const v=x[i]-x[i-tau];s+=v*v}
    d[tau]=s;
  }
  let run=0;d[0]=1;
  for(let tau=1;tau<=tauMax;tau++){run+=d[tau];d[tau]=d[tau]*tau/run}
  d.x=x;d.base=base;d.maxLag=base-1;
  return d;
}
function pickMin(d,lo,hi){
  lo=Math.max(2,Math.floor(lo));hi=Math.min(d.length-3,Math.ceil(hi));
  let m=-1,v=9;
  for(let t=lo;t<=hi;t++)if(d[t]<v){v=d[t];m=t}
  if(m<0)return null;
  // refine with normalised cross-correlation (immune to the note fading), measured over
  // several periods: a lag of k periods gives k times finer frequency resolution
  if(d.x&&m>1){
    const x=d.x,base=d.base,N=x.length,maxLag=d.maxLag,cache={};
    const nc=t=>cache[t]!==undefined?cache[t]:(()=>{let ab=0,aa=0,bb=0;for(let i=base;i<N;i++){const p=x[i],q=x[i-t];ab+=p*q;aa+=p*p;bb+=q*q}return cache[t]=ab/Math.sqrt(aa*bb+1e-12)})();
    const peak=(c0,r)=>{let bl=c0,bv=-9;for(let l=c0-r;l<=c0+r;l++){if(l<2||l>maxLag)continue;const v=nc(l);if(v>bv){bv=v;bl=l}}
      if(bl<=2||bl>=maxLag)return bl;const a=nc(bl-1),b=nc(bl),c=nc(bl+1),den=a+c-2*b;
      return bl+(den<0?Math.max(-1,Math.min(1,0.5*(a-c)/den)):0)};
    let T=peak(m,1);
    for(let k=2;k<=12&&k*T*1.01<=maxLag&&k*T<=4000;k++)T=peak(Math.round(k*T),2)/k;
    return {tau:T,score:v};
  }
  const a=d[m-1],b=d[m],c=d[m+1],den=a+c-2*b;
  return {tau:m+(den?0.5*(a-c)/den:0),score:v};
}
// midis: array of {idx,midi}; spanCents: search window either side of each string
function guided(d,sr,list,spanCents){
  const k=Math.pow(2,spanCents/1200);
  const cands=[];
  for(const s of list){
    const tau0=sr/midiToFreq(s.midi);
    const r=pickMin(d,tau0/k,tau0*k);
    if(!r)continue;
    r.idx=s.idx;r.f=sr/r.tau;
    if(Math.abs(1200*Math.log2(r.f/midiToFreq(s.midi)))>spanCents+25)continue; // refinement wandered off
    cands.push(r);
  }
  if(!cands.length)return null;
  cands.sort((a,b)=>a.score-b.score);
  let best=cands[0];
  // A note at period T is also "periodic" at 2T, 3T, 4T, so a low string's window can match a
  // higher string's note. If a shorter-period candidate is an integer fraction of the winner and
  // nearly as clear, it is the true fundamental.
  for(const c of cands){
    if(c.tau>=best.tau)continue;
    const ratio=best.tau/c.tau, n=Math.round(ratio);
    if(n>=2&&n<=6&&Math.abs(ratio-n)/n<0.03&&c.score<=best.score+(n===2?0.04:0.08))best=c;
  }
  return best;
}
window.__guided=guided;window.__ndf=ndf;

// ---------- audio / main loop ----------
let ctx,analyser,stream,buf,raf,wakeLock,running=false;
let tuneIdx=-1,tuneHist=[],latch=false,noise=0.0005,pend=-1,pendN=0,histIdx=-1,hist=[],lastGood=0,stableNote=null,stableCount=0;

async function start(){
  $("msg").textContent="";
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    $("msg").innerHTML='<span class="bad">Microphone blocked.</span> Allow mic access for this site in your browser/phone settings, then tap Start again.';
    return;
  }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==="suspended")await ctx.resume();
  const src=ctx.createMediaStreamSource(stream);
  analyser=ctx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=0;
  src.connect(analyser);
  buf=new Float32Array(analyser.fftSize);
  running=true;$("start").textContent="Stop";$("start").classList.add("on");
  $("hint").textContent="Pluck a string…";
  try{wakeLock=await navigator.wakeLock?.request("screen")}catch(e){}
  loop();
}
function stop(){
  running=false;cancelAnimationFrame(raf);
  stream&&stream.getTracks().forEach(t=>t.stop());
  ctx&&ctx.close();wakeLock&&wakeLock.release().catch(()=>{});
  $("start").textContent="Start tuning";$("start").classList.remove("on");
  reset();$("hint").textContent="Tap Start, then pluck a string";
}
$("start").onclick=()=>running?stop():start();
document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&running)stop();
});

function reset(){
  $("note").textContent="–";$("note").className="";$("freq").innerHTML="&nbsp;";
  $("cents").innerHTML="&nbsp;";setNeedle(0,true);
  document.querySelectorAll(".strings button").forEach(b=>b.classList.remove("near"));
}
function setNeedle(c,idle){
  const a=Math.max(-50,Math.min(50,c))/50*60;
  $("needle").style.transform="rotate("+a+"deg)";
  $("needleLine").setAttribute("stroke",idle?"#4a5163":"#fff");
}

function loop(){
  if(!running)return;
  analyser.getFloatTimeDomainData(buf);
  let rms=0;for(let i=0;i<buf.length;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/buf.length);
  noise=rms<noise?rms:noise*1.002;   // minimum tracker: falls fast, rises very slowly
  $("lvl").style.width=Math.min(100,rms*1200)+"%";
  let f=null,idx=-1,dbg="level "+rms.toFixed(4)+" · no pitch";
  const t=TUNINGS[tuningName];
  if(rms>Math.max(0.0004,noise*2)){
    if(t){
      // search window: up to 150 cents, but never wide enough to overlap a neighbouring string
      const uniq=[...new Set(t)].sort((a,b)=>a-b);
      let gap=1e9;for(let i=1;i<uniq.length;i++)gap=Math.min(gap,(uniq[i]-uniq[i-1])*100);
      const span=selected!==null?250:Math.min(150,gap/2-5);
      const ids=selected!==null?[selected]:t.map((_,i)=>i).filter(i=>t.indexOf(t[i])===i);
      const list=ids.map(i=>({idx:i,midi:t[i]}));
      const lowF=midiToFreq(Math.min(...ids.map(i=>t[i])))/Math.pow(2,span/1200);
      const d=ndf(buf,ctx.sampleRate,Math.ceil(ctx.sampleRate/lowF)+3);
      if(d){
        const r=guided(d,ctx.sampleRate,list,span);
        if(r){
          dbg="level "+rms.toFixed(4)+" · clarity "+(1-r.score).toFixed(2)+" · "+r.f.toFixed(1)+"Hz";
          if(r.score<0.3||(r.idx===histIdx&&hist.length&&r.score<0.45)){f=r.f;idx=r.idx}
        }
      }
    }else f=yin(buf,ctx.sampleRate);
  }
  $("dbg").textContent=dbg;
  let usable=f&&f>50&&f<1000;
  if(usable&&hist.length&&histIdx!==idx){
    // a different string: only switch after it wins several frames in a row (ignores one-frame blips)
    if(idx===pend)pendN++;else{pend=idx;pendN=1}
    if(pendN>=4){hist=[];histIdx=idx;pend=-1;pendN=0}
    else usable=false;
  }else if(usable){pend=-1;pendN=0}
  const now=performance.now();
  if(usable){
    histIdx=idx;
    hist.push(f);if(hist.length>5)hist.shift();
    if(hist.length>=2){
      const sorted=[...hist].sort((a,b)=>a-b);
      show(sorted[sorted.length>>1],idx);
      lastGood=now;
    }
    document.body.classList.remove("stale");
  }else{
    // no clear note right now: keep the last reading visible (dimmed) so it can be read
    if(now-lastGood>600)document.body.classList.add("stale");
    if(now-lastGood>3000){
      hist=[];histIdx=-1;pend=-1;pendN=0;tuneIdx=-1;tuneHist=[];latch=false;document.body.classList.remove("stale");
      if($("note").textContent!=="–")reset(),$("hint").className="",$("hint").textContent="Pluck a string…";
    }
  }
  raf=requestAnimationFrame(loop);
}

function show(f,knownIdx){
  const t=TUNINGS[tuningName];
  let targetMidi,nearIdx=-1;
  if(t){
    if(knownIdx>=0){nearIdx=knownIdx}
    else if(selected!==null){nearIdx=selected}
    else{ // closest string in cents
      let best=1e9;
      t.forEach((m,i)=>{const c=Math.abs(1200*Math.log2(f/midiToFreq(m)));if(c<best){best=c;nearIdx=i}});
    }
    targetMidi=t[nearIdx];
  }else{
    targetMidi=Math.round(freqToMidiF(f));
  }
  const tf=midiToFreq(targetMidi);
  const cents=1200*Math.log2(f/tf);
  // "in tune" = within 5 cents. Once most of a short run is in tune it LATCHES (up to 9 cents)
  // so a quickly fading note keeps showing green instead of flickering.
  if(nearIdx!==tuneIdx){tuneIdx=nearIdx;tuneHist=[];latch=false}
  tuneHist.push(Math.abs(cents)<=5);if(tuneHist.length>8)tuneHist.shift();
  if(!latch&&tuneHist.length>=4&&tuneHist.filter(Boolean).length>=Math.ceil(tuneHist.length*0.6))latch=true;
  if(latch&&Math.abs(cents)>9){latch=false;tuneHist=[]}
  const inTune=Math.abs(cents)<=5||(latch&&Math.abs(cents)<=9);
  const cls=inTune?"ok":Math.abs(cents)<=15?"warn":"bad";

  $("note").innerHTML=noteName(targetMidi)+"<small>"+oct(targetMidi)+"</small>";
  $("note").className=cls;
  $("freq").textContent=f.toFixed(1)+" Hz  →  "+tf.toFixed(1)+" Hz";
  const sign=cents>0?"+":"";
  $("cents").textContent=sign+cents.toFixed(0)+" cents";
  setNeedle(cents);
  $("hint").className=cls;
  $("hint").textContent=inTune?"In tune ✓":(cents<0?"Too low – tighten ↑":"Too high – loosen ↓");

  document.querySelectorAll(".strings button").forEach(b=>b.classList.toggle("near",!!t&&t[+b.dataset.i]===t[nearIdx]&&selected===null));
  if(t&&latch&&!done.has(nearIdx)){done.add(nearIdx);buildStrings()}
}

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(!window.isSecureContext)$("msg").innerHTML='<span class="warn">Microphone needs https:// — open this page from a secure address.</span>';
</script>
</body>
